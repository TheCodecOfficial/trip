ticketGuides:
  smartex:
    name: smartEX
    summary: Ticketless. The booking is linked to your IC card; just tap through the shinkansen gate.
    steps:
      - Tap the linked IC card at the shinkansen transfer/entry gate.
      - Take the seat slip that the gate prints.
      - Changes are possible in the app before departure.
    url: "https://smart-ex.jp/en/"
  e5489:
    name: e5489 (JR West)
    summary: The ticket is tied to the credit card used for booking. Pick it up at a JR West ticket machine.
    steps:
      - At a JR West ticket machine, choose to pick up a reserved ticket.
      - Insert the same credit card used for booking.
      - Collect all tickets (base fare + express) and put both into the gate.
    url: "https://www.westjr.co.jp/global/en/"

